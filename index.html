<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            color: #0366d6;
            border-bottom: 2px solid #0366d6;
            padding-bottom: 10px;
        }
        .status {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin: 20px 0;
        }
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e1e4e8;
            color: #586069;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>GitHub Pages Test Site</h1>
    <div class="status">✓ GitHub Pages is working!</div>
    <p>This is a simple test page for GitHub Pages deployment.</p>
    <p>If you can see this page, your GitHub Pages site is successfully deployed and accessible.</p>
    <footer>
        <p>Repository: <a href="https://github.com/pacesmarek/pages">pacesmarek/pages</a></p>
    </footer>
</body>
</html>
